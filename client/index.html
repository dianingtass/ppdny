<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIM-Tren</title>

    <!-- PWA Meta Tags -->
    <meta name="application-name" content="SIM-Tren" />
    <meta name="description" content="Sistem Informasi Pesantren — Layanan Kesehatan & Administrasi" />
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SIM-Tren" />

    <!-- Favicon & Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/logo.png" />

    <!-- iOS Startup Splash Screen (Launch Image) -->
    <link rel="apple-touch-startup-image" href="/apple-splash.png" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/apple-splash.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />

    <!-- Geist font (preload agar tersedia di splash screen) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Splash Screen CSS (dari public/ agar langsung tersedia tanpa bundling) -->
    <link rel="stylesheet" href="/splash.css" />
  </head>
  <body>
    <!-- Custom Splash Screen (tersembunyi saat React selesai mount) -->
    <div id="splash-screen" role="status" aria-label="Memuat aplikasi...">
      <img src="/pwa-192x192.png" alt="SIM-Tren Logo" class="splash-logo" />
      <h1 class="splash-title">SIM-Tren</h1>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Sembunyikan splash screen setelah React selesai render -->
    <script>
      window.__splashStart = Date.now();
      window.__hideSplash = function () {
        var el = document.getElementById('splash-screen');
        if (el) {
          var elapsed = Date.now() - window.__splashStart;
          // Deteksi apakah dijalankan sebagai aplikasi terinstall (PWA Standalone) atau browser biasa
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
          var minDuration = isStandalone ? 0 : 1000; // Jika PWA terinstall, lewati loading screen tambahan agar instan
          var delay = Math.max(0, minDuration - elapsed);
          
          setTimeout(function () {
            el.classList.add('hidden');
            setTimeout(function () { el.remove(); }, 450);
          }, delay);
        }
      };
    </script>
  </body>
</html>
