  <body>

    <!-- Custom Splash Screen (tersembunyi saat React selesai mount) -->
    <div id="splash-screen" role="status" aria-label="Memuat aplikasi...">
      <img src="/pwa-192x192.png" alt="ScabiSmart Logo" class="splash-logo">
      <h1 class="splash-title">ScabiSmart</h1>
      <div class="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Sembunyikan splash screen setelah React selesai render -->
    <script>
      window.__splashStart = Date.now();
      window.__hideSplash = function() {
        var el = document.getElementById('splash-screen');
        if (el) {
          var elapsed = Date.now() - window.__splashStart;
          // Deteksi apakah dijalankan sebagai aplikasi terinstall (PWA Standalone) atau browser biasa
          var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
          var minDuration = isStandalone ? 0 : 1000; // Jika PWA terinstall, lewati loading screen tambahan agar instan
          var delay = Math.max(0, minDuration - elapsed);
          setTimeout(function() {
            el.classList.add('hidden');
            setTimeout(function() {
              el.remove();
            }, 450);
          }, delay);
        }
      };
    </script>
